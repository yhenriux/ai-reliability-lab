name: Version verified Qwen3 4B artifact
on:
  push:
    branches:
      - results/qwen3-4b-verified-run-42430639080
    paths:
      - .github/workflows/version-qwen-artifact.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  version-original-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: results/qwen3-4b-verified-run-42430639080
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download original artifact from successful workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42430639080 --repo yhenriux/ai-reliability-lab --name qwen3-4b-100-real-inference --dir /tmp/qwen-original
          test -s /tmp/qwen-original/qwen3-4b-100.json
          mkdir -p data
          cp /tmp/qwen-original/qwen3-4b-100.json data/real_full_qwen3_4b_v2.json
      - name: Verify exact dataset identity, uniqueness, and measured metrics
        run: |
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          from engine import digest, load_data
          p=Path('data/real_full_qwen3_4b_v2.json')
          run=json.loads(p.read_text(encoding='utf-8'))
          _, dataset=load_data('2.0')
          cases=run['cases']
          ids=[c['case_id'] for c in cases]
          expected={c['id'] for c in dataset['cases']}
          assert run['mode']=='real_local_llm',run['mode']
          assert run['provider']=='ollama',run['provider']
          assert run['model']=='qwen3:4b',run['model']
          assert run['dataset_version']=='2.0'
          assert run['dataset_hash']==digest(dataset)
          assert len(cases)==100 and len(set(ids))==100 and set(ids)==expected
          assert run['metrics']['n']==100
          print('SHA256:',hashlib.sha256(p.read_bytes()).hexdigest())
          print('VERIFIED: 100 unique cases, matching dataset v2.0, real_local_llm, ollama qwen3:4b')
          print('METRICS:',json.dumps(run['metrics'],ensure_ascii=False,indent=2))
          PY
      - name: Prepare 20-case human-review worksheet without human judgments
        run: |
          python -m scripts.prepare_human_review data/real_full_qwen3_4b_v2.json --output data/review_20_qwen3_4b_v2.csv
          python - <<'PY'
          import csv
          with open('data/review_20_qwen3_4b_v2.csv',encoding='utf-8',newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==20 and len({r['case_id'] for r in rows})==20
          for r in rows:
              for k,v in r.items():
                  if any(term in k.lower() for term in ('human_', 'reviewer_', 'human judgment', 'human verdict')):
                      assert not v.strip(), (r['case_id'],k)
          print('20 review cases; human verdicts remain unfilled')
          PY
      - name: Commit authentic results to existing PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/real_full_qwen3_4b_v2.json data/review_20_qwen3_4b_v2.csv
          if git diff --cached --quiet; then
            echo 'Files already versioned'
          else
            git commit -m 'data: version verified 100-case Qwen3 4B real run and 20-case review sheet'
            git push origin HEAD:results/qwen3-4b-verified-run-42430639080
          fi
