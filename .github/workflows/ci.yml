name: Tests and quality gates
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal runtime and test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Syntax
        run: python -m compileall -q .
      - name: Unit and Streamlit integration tests
        run: python -m pytest -q
      - name: Full 100-case deterministic regression gate
        run: |
          python -m scripts.run_evaluation --provider demo --dataset-version 2.0 \
            --baseline data/baseline_demo_v2.json --gates config/quality_gates.json \
            --output artifacts/demo-evaluation.json --strict
      - name: Publish reproducible CI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-quality-report
          path: artifacts/demo-evaluation.json
          if-no-files-found: ignore
